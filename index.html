<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Community Ops Desk</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: #14171c; }
  #ops-desk-root {
    --bg: #14171c;
    --surface: #1a1e25;
    --surface-raised: #20252d;
    --border: #2a2f3a;
    --text: #e8e6df;
    --text-muted: #8b8f99;
    /* --gold is the app's main brand accent — set to Combo Interactive's red rather than literal gold */
    --gold: #d81f3b;
    --gold-dim: #7a1425;
    --ok: #4d8b6f;
    --warn: #b3543f;
    --infinite: #4a9eff; /* Cabal Infinite Combo SEA accent — matches the logo's blue glow */
    --ultimate: #2ecc8f; /* Cabal Ultimate Combo SEA accent — matches the logo's green glow */
    font-family: "Segoe UI", "IBM Plex Sans", -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  #ops-desk-root * { box-sizing: border-box; }
  .od-shell { display: flex; min-height: 100vh; }
  .od-nav {
    width: 190px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 20px 14px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .od-brand {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.2px;
    color: var(--gold);
    margin-bottom: 22px;
    padding: 0 6px;
  }
  .od-brand span { color: var(--text-muted); font-weight: 400; display: block; font-size: 11px; margin-top: 2px; }
  .od-navbtn {
    text-align: left;
    background: none;
    border: none;
    color: var(--text-muted);
    padding: 9px 10px;
    border-radius: 5px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
  }
  .od-navbtn:hover { background: var(--surface-raised); color: var(--text); }
  .od-navbtn.active { background: var(--surface-raised); color: var(--text); border-left: 2px solid var(--gold); padding-left: 8px; }
  .admin-tab-btn { padding: 7px 14px; border-radius: 5px; }
  .admin-tab-btn.active { background: var(--gold); color: #ffffff; border-color: var(--gold); font-weight: 600; }
  .od-main { flex: 1; padding: 26px 32px; min-width: 0; }
  .od-h1 { font-size: 19px; font-weight: 700; margin: 0 0 3px; }
  .od-sub { font-size: 13px; color: var(--text-muted); margin: 0 0 22px; }
  .od-row { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }

  /* ---- Mobile layout (phones/narrow tablets) ---- */
  @media (max-width: 760px) {
    .od-shell { flex-direction: column; min-height: 100vh; }
    .od-nav {
      width: 100%;
      flex-direction: row;
      flex-wrap: nowrap;
      overflow-x: auto;
      align-items: center;
      padding: 10px 12px;
      border-right: none;
      border-bottom: 1px solid var(--border);
      gap: 6px;
      -webkit-overflow-scrolling: touch;
    }
    .od-brand { margin-bottom: 0; padding: 0 8px 0 0; white-space: nowrap; flex-shrink: 0; }
    .od-brand span { display: none; }
    #brand-logo-nav { height: 32px !important; margin-bottom: 0 !important; }
    .od-navbtn { white-space: nowrap; flex-shrink: 0; }
    .od-navbtn.active { border-left: none; padding-left: 10px; border-bottom: 2px solid var(--gold); }
    #admin-lock-panel, #admin-unlocked-panel { width: 180px; flex-shrink: 0; }
    .od-nav > div[style*="margin-top"] { margin-top: 0 !important; padding-top: 0 !important; border-top: none !important; border-left: 1px solid var(--border); padding-left: 10px !important; }
    .od-main { padding: 18px 14px; }
    .od-h1 { font-size: 17px; }
    .od-card { width: 100% !important; max-width: 100%; }
    /* Any field with a fixed pixel width (Approved members, Reactions, group size, etc.)
       forces itself full-width instead of squeezing down on narrow screens. */
    .od-field { width: 100% !important; }
    /* Entry rows (Concern/Feedback/Suggestion) pack 5-6 inputs on one line on desktop —
       that has no room to breathe on a phone, so stack each field on its own line instead. */
    .entry-row {
      flex-direction: column;
      align-items: stretch;
      gap: 6px;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .entry-row > * { width: 100% !important; flex: none !important; }
    .entry-row .entry-remove { align-self: flex-end; width: auto !important; padding: 6px 16px !important; font-weight: 700; }
    table { font-size: 12px; }
  }
  .od-select, .od-input, .od-textarea {
    background: var(--surface-raised);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 5px;
    font-size: 13px;
    font-family: inherit;
  }
  .od-textarea { width: 100%; min-height: 64px; resize: vertical; }
  .od-field { margin-bottom: 14px; }
  .od-label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
  .od-input, .od-textarea { width: 100%; }
  .od-btn {
    background: var(--gold);
    color: #ffffff;
    border: none;
    padding: 9px 18px;
    border-radius: 5px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .od-btn:hover { background: #f0334e; }
  .od-btn:disabled { background: var(--gold-dim); cursor: default; color: var(--text-muted); }
  .od-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px 18px;
    margin-bottom: 10px;
  }
  .od-card-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .od-card-name { font-weight: 600; font-size: 14px; }
  .od-card-date { font-size: 12px; color: var(--text-muted); }
  .od-kv { font-size: 13px; margin-bottom: 6px; line-height: 1.45; }
  .od-kv b { color: var(--text-muted); font-weight: 500; }
  .od-pill {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 20px;
    font-weight: 600;
  }
  .od-pill.ok { background: rgba(77,139,111,0.18); color: var(--ok); }
  .od-pill.warn { background: rgba(179,84,63,0.18); color: var(--warn); }
  .od-empty { color: var(--text-muted); font-size: 13px; padding: 30px 0; text-align: center; border: 1px dashed var(--border); border-radius: 6px; }
  .od-roster { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
  .od-status-msg { font-size: 13px; color: var(--ok); margin-top: 8px; }
  .od-section-label { font-size: 12px; text-transform: none; color: var(--text-muted); margin: 22px 0 10px; font-weight: 600; }
  .od-loading { color: var(--text-muted); font-size: 13px; padding: 40px; text-align: center; }
</style>
</head>
<body>


<div id="ops-desk-root">
  <div class="od-shell">
    <div class="od-nav">
      <div class="od-brand"><img id="brand-logo-nav" alt="Combo Interactive" style="height:52px;width:auto;display:block;margin-bottom:6px;" /><span>Cabal SEA · Community Team</span></div>
      <button class="od-navbtn" data-view="home">Home</button>
      <button class="od-navbtn" data-view="mod">Moderator report</button>
      <button class="od-navbtn" data-view="leader">Leader report</button>
      <button class="od-navbtn" data-view="admin" id="nav-admin" style="display:none;">Admin view</button>
      <button class="od-navbtn" data-view="tracker" id="nav-tracker" style="display:none;">Effectiveness tracker</button>
      <div style="margin-top:auto;padding-top:12px;border-top:1px solid var(--border);">
        <div id="admin-lock-panel">
          <label class="od-label" style="font-size:11px;">Admin access</label>
          <input id="admin-passcode" type="password" placeholder="Passcode" class="od-input" style="width:100%;font-size:12px;padding:6px 8px;margin-bottom:6px;" />
          <button id="admin-unlock-btn" class="od-navbtn" style="width:100%;text-align:center;background:var(--surface-raised);border:1px solid var(--border);">Unlock admin</button>
          <div id="admin-lock-msg" style="font-size:11px;color:var(--warn);margin-top:4px;"></div>
        </div>
        <div id="admin-unlocked-panel" style="display:none;">
          <div id="admin-unlocked-label" style="font-size:12px;color:var(--ok);margin-bottom:6px;">✓ Admin unlocked</div>
          <button id="admin-lock-btn" class="od-navbtn" style="width:100%;text-align:center;background:var(--surface-raised);border:1px solid var(--border);">Lock admin</button>
        </div>
      </div>
    </div>
    <div class="od-main" id="od-main">
      <div class="od-loading">Loading…</div>
    </div>
  </div>
  <div id="od-footer" style="border-top:1px solid var(--border);background:var(--surface);padding:20px;text-align:center;">
    <img id="brand-logo-footer" alt="Combo Interactive" style="height:32px;width:auto;display:block;margin:0 auto 10px;" />
    <div style="font-size:11px;color:var(--text-muted);line-height:1.6;">
      © ESTgames Corp. All Rights Reserved. Published by Combo InterActive LIMITED.<br>
      CBSOFT Company Limited — Philippine Representative Office
    </div>
  </div>
</div>

  if (footerLogo) footerLogo.src = LOGO_COMPANY;
  let currentView = 'home';
  const ADMIN_PASSCODE = 'ComboInteractive#InfiniteAdmin26'; // full access — can edit (change issue status, etc.)
  const GUEST_PASSCODE = 'ComboInteractive#UltimateGuest26'; // view-only — sees Admin view & Tracker, can't edit anything
  let isAdmin = false;      // true for BOTH admin and guest — controls whether the tabs are visible
  let canEdit = false;      // true ONLY for full admin — controls whether edit controls are shown

  const navAdminBtn = document.getElementById('nav-admin');
  const navTrackerBtn = document.getElementById('nav-tracker');
  const lockPanel = document.getElementById('admin-lock-panel');
  const unlockedPanel = document.getElementById('admin-unlocked-panel');

  document.getElementById('admin-unlock-btn').addEventListener('click', () => {
    const input = document.getElementById('admin-passcode');
    const msg = document.getElementById('admin-lock-msg');
    const unlockedLabel = document.getElementById('admin-unlocked-label');
    if (input.value === ADMIN_PASSCODE) {
      isAdmin = true;
      canEdit = true;
      navAdminBtn.style.display = '';
      navTrackerBtn.style.display = '';
      lockPanel.style.display = 'none';
      unlockedPanel.style.display = '';
      if (unlockedLabel) unlockedLabel.textContent = '✓ Admin unlocked (full access)';
      msg.textContent = '';
      input.value = '';
    } else if (input.value === GUEST_PASSCODE) {
      isAdmin = true;
      canEdit = false;
      navAdminBtn.style.display = '';
      navTrackerBtn.style.display = '';
      lockPanel.style.display = 'none';
      unlockedPanel.style.display = '';
      if (unlockedLabel) unlockedLabel.textContent = '✓ Admin unlocked (view only)';
      msg.textContent = '';
      input.value = '';
    } else {
      msg.textContent = 'Wrong passcode.';
    }
    if (currentView === 'admin' || currentView === 'tracker') render();
  });
  document.getElementById('admin-lock-btn').addEventListener('click', () => {
    isAdmin = false;
    canEdit = false;
    navAdminBtn.style.display = 'none';
    navTrackerBtn.style.display = 'none';
    lockPanel.style.display = '';
    unlockedPanel.style.display = 'none';
    if (currentView === 'admin' || currentView === 'tracker') { currentView = 'home'; render(); }
  });

  // Delegated so it keeps working even when copy buttons are added later inside dynamically-loaded panels.
  root.addEventListener('click', async (e) => {
    const btn = e.target.closest('.copy-discord-id');
    if (!btn) return;
    const id = btn.dataset.id;
    try {
      await navigator.clipboard.writeText(id);
      const original = btn.textContent;
      btn.textContent = 'Copied!';
      setTimeout(() => { btn.textContent = original; }, 1500);
    } catch (err) {
      btn.textContent = 'Copy failed';
    }
  });

  // Delegated (not bound per-render) so "+ Add entry" keeps working reliably across
  // re-renders, name switches, and any in-app browser quirks (e.g. Messenger's WebView).
  root.addEventListener('click', (e) => {
    const btn = e.target.closest('.add-entry-row-btn');
    if (!btn) return;
    addRepeatableRow(btn.dataset.container, btn.dataset.withName === 'true');
  });

  function todayStr() {
    return new Date().toISOString().slice(0,10);

  function monthStr() {
    return new Date().toISOString().slice(0,7);

    return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function initials(name) {
    return (name || '').trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
  }
  function avatarColor(name) {
    let hash = 0;
    for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
    return AVATAR_PALETTE[hash % AVATAR_PALETTE.length];
  }
  function avatarHtml(name, size) {
    size = size || 56;
    if (MOD_AVATARS[name]) {
      return `<img src="${MOD_AVATARS[name]}" style="width:${size}px;height:${size}px;border-radius:50%;object-fit:cover;flex-shrink:0;" alt="${escapeHtml(name)}"/>`;
    }
    return `<div style="width:${size}px;height:${size}px;border-radius:50%;background:${avatarColor(name)};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:${Math.round(size*0.36)}px;flex-shrink:0;">${escapeHtml(initials(name))}</div>`;
  }

  function addRepeatableRow(containerId, withName) {
    const container = document.getElementById(containerId);
    if (!container) return;
    const row = document.createElement('div');
    row.className = 'od-row entry-row';
    row.style.marginBottom = '6px';
    row.innerHTML = `
      ${withName ? '<input class="od-input entry-name" style="flex:1" placeholder="Player name" />' : ''}
      <select class="od-select entry-platform" style="width:110px"><option>FB Group</option><option>Discord</option><option>In-game</option></select>
      <input class="od-input entry-desc" style="flex:2" placeholder="Description" />
      <input class="od-input entry-link" style="flex:1" type="url" placeholder="Link (optional)" />
      <select class="od-select entry-status" style="width:100px"><option value="Open">Open</option><option value="Escalated">Escalated</option></select>
      <button type="button" class="entry-remove" title="Remove this entry" style="background:none;border:1.5px solid var(--warn);color:var(--warn);border-radius:5px;width:32px;height:32px;font-size:16px;font-weight:700;cursor:pointer;flex-shrink:0;">×</button>
    `;
    row.querySelector('.entry-remove').addEventListener('click', () => row.remove());
    container.appendChild(row);
  }

  function collectRepeatableRows(containerId) {
    const container = document.getElementById(containerId);
    if (!container) return [];
    const rows = [...container.querySelectorAll('.entry-row')];
    return rows.map(row => {
      const nameEl = row.querySelector('.entry-name');
      return {
        playerName: nameEl ? nameEl.value.trim() : '',
        platform: row.querySelector('.entry-platform').value,
        description: row.querySelector('.entry-desc').value.trim(),
        link: row.querySelector('.entry-link').value.trim(),
        status: row.querySelector('.entry-status').value,
        resolvedDate: null
      };
    }).filter(e => e.playerName || e.description || e.link);
  }

  function statusColor(status) {
    if (status === 'Resolved') return 'var(--ok)';
    if (status === 'Escalated') return 'var(--warn)';
    return 'var(--text-muted)';
  }

  function sentinelReportBodyHtml(r) {
    let html = '';
    const entryLine = (e) => {
      const link = e.link ? ` <a href="${e.link}" target="_blank" style="color:var(--gold)">[link]</a>` : '';
      const name = e.playerName ? `${escapeHtml(e.playerName)} ` : '';
      const status = e.status || 'Open';
      const statusTag = ` <span style="color:${statusColor(status)};font-weight:600;">[${status}]</span>`;
      return `${name}[${e.platform}] — ${escapeHtml(e.description)}${link}${statusTag}`;
    };
    const cn = r.concernEntries || [];
    html += `<div class="od-kv"><b>Concerns (${cn.length}):</b> ${cn.length ? cn.map(entryLine).join('; ') : '—'}</div>`;
    const fb = r.feedbackEntries || [];
    html += `<div class="od-kv"><b>Feedback (${fb.length}):</b> ${fb.length ? fb.map(entryLine).join('; ') : '—'}</div>`;
    const sg = r.suggestionEntries || [];
    html += `<div class="od-kv"><b>Suggestions (${sg.length}):</b> ${sg.length ? sg.map(entryLine).join('; ') : '—'}</div>`;
    if (r.bugs) html += `<div class="od-kv"><b>Bug/issue report:</b> ${escapeHtml(r.bugs)}</div>`;
    html += `<div class="od-kv"><b>Approved members:</b> ${r.approvedMembers || 0} &nbsp; <b>Approved posts:</b> ${r.approvedPosts || 0}</div>`;
    return html;
  }

  async function safeGet(key) {
    try {
      const snap = await getDoc(doc(db, KV_COLLECTION, key));
      return snap.exists() ? snap.data().value : null;
    } catch (e) { console.error('safeGet failed', key, e); return null; }
  }
  async function safeSet(key, value) {
    try {
      await setDoc(doc(db, KV_COLLECTION, key), { value });
      return true;
    } catch (e) { console.error('safeSet failed', key, e); return false; }
  }
  async function safeList(prefix) {
    try {
      const snap = await getDocs(collection(db, KV_COLLECTION));
      const keys = [];
      snap.forEach(d => { if (d.id.startsWith(prefix)) keys.push(d.id); });
      return keys;
    } catch (e) { console.error('safeList failed', prefix, e); return []; }
  }

  navBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      currentView = btn.dataset.view;
      render();
    });
  });

  function markActive() {
    navBtns.forEach(b => b.classList.toggle('active', b.dataset.view === currentView));
  }

  async function render() {
    markActive();
    main.innerHTML = '<div class="od-loading">Loading…</div>';
    if ((currentView === 'admin' || currentView === 'tracker') && !isAdmin) {
      currentView = 'home';
    }
    if (currentView === 'home') return renderHome();
    if (currentView === 'mod') return renderMod();
    if (currentView === 'leader') return renderLeader();
    if (currentView === 'admin') return renderAdmin();
    if (currentView === 'tracker') return renderTracker();
  }

  // ---------- HOME ----------
  function renderHome() {
    const SENTINEL_DUTY = "Handles player inquiries, moderates the Official Facebook group and Official Discord server, filters spam and fraudulent accounts, escalates technical issues, and submits daily reports.";
    const EC_DUTY = "Plans and runs the monthly community event, posts content per the team brief, and reports back reach, engagement, and reactions from Facebook Insights.";
    const LEADER_DESC = {
      "Cabal Infinite Combo SEA": "Our Community Leaders are trusted partners who manage and grow their own Cabal Infinite Combo SEA communities. They bring players together, keep their groups active, and organize exciting events and activities for the community.<br><br>They serve as a bridge between players and Combo Interactive, helping create a more connected, engaging, and enjoyable experience for everyone.",
      "Cabal Ultimate Combo SEA": "Our Community Leaders are trusted partners who manage and grow their own Cabal Ultimate Combo SEA communities. They bring players together, keep their groups active, and organize exciting events and activities for the community.<br><br>They serve as a bridge between players and Combo Interactive, helping create a more connected, engaging, and enjoyable experience for everyone."
    };

    function logoImg(x, y, w, h, logoUrl) {
      if (logoUrl) {
        return `<image href="${logoUrl}" x="${x}" y="${y}" width="${w}" height="${h}" preserveAspectRatio="xMidYMid meet"/>`;
      }
      return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="none" stroke="var(--border)" stroke-dasharray="3,2"/>
        <text x="${x + w/2}" y="${y + h/2 + 3}" text-anchor="middle" font-size="7" fill="var(--text-muted)">LOGO</text>`;
    }

    // Build one repeatable column per product — add an entry to PRODUCTS to extend this.
    // On narrow screens, stack the products vertically instead of side-by-side, so the
    // person scrolls down (normal) instead of sideways to see every product.
    const stacked = window.innerWidth <= 760;
    const n = PRODUCTS.length;
    const leadBoxW = 340;
    const leadBoxH = 322;
    const LEAD_Y = 140; // top of the first product's lead box — leaves room for the company banner above
    const stackGap = 50; // vertical gap between stacked product boxes on narrow screens

    const colW = stacked ? leadBoxW + 40 : 380;
    const colGap = 40;
    const svgWidth = stacked ? colW : (n * colW + (n - 1) * colGap + 40);
    const svgHeight = stacked
      ? LEAD_Y + n * leadBoxH + (n - 1) * stackGap + 20
      : LEAD_Y + leadBoxH + 20;

    let productSvg = '';
    PRODUCTS.forEach((p, i) => {
      const colX = stacked ? 20 : 20 + i * (colW + colGap);
      const centerX = stacked ? (svgWidth / 2) : (colX + colW / 2);
      const leadX = centerX - leadBoxW / 2;
      const leadY = stacked ? (LEAD_Y + i * (leadBoxH + stackGap)) : LEAD_Y;
      const logoY = leadY + 10, logoH = 64, logoW = 180;
      const avR = 32, avCy = logoY + logoH + 12 + avR, avCx = centerX;

      productSvg += `
        <!-- product lead box -->
        <rect x="${leadX}" y="${leadY}" width="${leadBoxW}" height="${leadBoxH}" rx="6" fill="var(--surface-raised)" stroke="${p.accent}" stroke-width="1.5"/>
        ${logoImg(centerX - logoW/2, logoY, logoW, logoH, p.logo)}
        <defs><clipPath id="avatarClip${i}"><circle cx="${avCx}" cy="${avCy}" r="${avR}"/></clipPath></defs>
        <image href="${p.leadAvatar}" x="${avCx - avR}" y="${avCy - avR}" width="${avR*2}" height="${avR*2}" preserveAspectRatio="xMidYMid slice" clip-path="url(#avatarClip${i})"/>
        <circle cx="${avCx}" cy="${avCy}" r="${avR}" fill="none" stroke="${p.accent}" stroke-width="2"/>
        <text x="${centerX}" y="${avCy + avR + 22}" text-anchor="middle" font-size="13" font-weight="700" fill="${p.accent}">${escapeHtml(p.leadTitle)}</text>
        <text x="${centerX}" y="${avCy + avR + 40}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--text)">${escapeHtml(p.leadName)}</text>
        <text x="${centerX}" y="${avCy + avR + 56}" text-anchor="middle" font-size="11" fill="var(--text-muted)">${escapeHtml(p.leadRole)}</text>

        <line x1="${leadX + 14}" y1="${avCy + avR + 70}" x2="${leadX + leadBoxW - 14}" y2="${avCy + avR + 70}" stroke="var(--border)" stroke-width="1"/>

        <a href="${p.leadFbProfile}" target="_blank">
          <rect x="${centerX - 90}" y="${avCy + avR + 80}" width="180" height="22" rx="5" fill="none" stroke="${p.accent}" stroke-width="1.2"/>
          <text x="${centerX}" y="${avCy + avR + 95}" text-anchor="middle" font-size="11" fill="${p.accent}">Facebook Profile</text>
        </a>
        <a href="${p.leadFbPage}" target="_blank">
          <rect x="${centerX - 90}" y="${avCy + avR + 108}" width="180" height="22" rx="5" fill="none" stroke="${p.accent}" stroke-width="1.2"/>
          <text x="${centerX}" y="${avCy + avR + 123}" text-anchor="middle" font-size="11" fill="${p.accent}">${escapeHtml(p.leadFbPageLabel === 'Page' ? 'Facebook Page' : p.leadFbPageLabel)}</text>
        </a>
        <rect x="${centerX - 90}" y="${avCy + avR + 136}" width="180" height="22" rx="5" fill="none" stroke="var(--border)" stroke-width="1.2"/>
        <text x="${centerX}" y="${avCy + avR + 151}" text-anchor="middle" font-size="11" fill="var(--text-muted)">Discord: ${escapeHtml(p.leadDiscord)}</text>
      `;
    });

    const svg = `
      <svg viewBox="0 0 ${svgWidth} ${svgHeight}" style="width:${svgWidth}px;max-width:none;height:auto;display:block;margin:0 auto;">
        <!-- Company banner -->
        <rect x="${svgWidth/2-170}" y="10" width="340" height="110" rx="8" fill="var(--surface-raised)" stroke="var(--gold)" stroke-width="2"/>
        ${logoImg(svgWidth/2-140, 25, 280, 80, LOGO_COMPANY)}

        ${productSvg}
      </svg>
    `;

    // Buttons below the chart — one per product — each expands that product's team below.
    const teamButtons = PRODUCTS.map(p => `
      <button class="org-team-btn" data-game="${escapeHtml(p.game)}" style="flex:1;min-width:220px;padding:14px;border-radius:20px;border:2px solid ${p.accent};background:var(--surface-raised);color:var(--text);cursor:pointer;">
        <div style="font-weight:700;font-size:14px;color:${p.accent};">${escapeHtml(p.game.replace(' SEA', ''))} Team</div>
        <div style="font-size:12px;color:var(--text-muted);margin-top:2px;">Meet the SEA Community Team →</div>
      </button>`).join('');

    function teamBadge(name, href, accent) {
      accent = accent || 'var(--gold)';

    root.querySelectorAll('.org-team-btn').forEach(btn => {

    async function submitReport() {
      const name = nameSel.value, role = currentRole();
      const status = () => document.getElementById('mod-status');
      if (!name || !role) { status().style.color = 'var(--warn)'; status().textContent = 'Pick your role and name first.'; return; }
      const btn = document.getElementById('mod-submit');
      if (role === 'Sentinel') {
        const concernEntries = collectRepeatableRows('concern-rows');
        const feedbackEntries = collectRepeatableRows('feedback-rows');
        const suggestionEntries = collectRepeatableRows('suggestion-rows');
        const bugs = document.getElementById('f-bugs').value;
        const approvedMembers = Number(document.getElementById('s-approved').value) || 0;
        const approvedPosts = Number(document.getElementById('s-approved-posts').value) || 0;
        const report = {
          name, role, game: MOD_ROSTER[name].game, date: todayStr(),
          concernEntries, feedbackEntries, suggestionEntries, bugs, approvedMembers, approvedPosts,
          submittedAt: new Date().toISOString()
        };
        btn.disabled = true;
        const ok = await safeSet(`mod-report:${name}:${report.date}`, JSON.stringify(report));
        if (bugs && bugs.trim()) await safeSet(`mod-lastbug:${name}`, todayStr());
        btn.disabled = false;
        status().style.color = 'var(--ok)';
        status().textContent = ok ? 'Report submitted for today.' : 'Could not save — try again.';
      } else {
        const title = document.getElementById('ec-title').value.trim();
        const start = document.getElementById('ec-start').value || todayStr();
        if (!title) { status().style.color = 'var(--warn)'; status().textContent = 'Enter the event title first.'; return; }
        const event = {
          name, role, game: MOD_ROSTER[name].game, title,
          platform: document.getElementById('ec-platform').value,
          groupName: document.getElementById('ec-groupname').value,
          groupSize: Number(document.getElementById('ec-groupsize').value) || 0,
          eventLink: document.getElementById('ec-eventlink').value,
          winnerLink: document.getElementById('ec-winnerlink').value,
          type: document.getElementById('ec-type').value,
          start, end: document.getElementById('ec-end').value,
          reactions: Number(document.getElementById('ec-reactions').value) || 0,
          comments: Number(document.getElementById('ec-comments').value) || 0,
          shares: Number(document.getElementById('ec-shares').value) || 0,
          reached: Number(document.getElementById('ec-reached').value) || 0,
          engagement: Number(document.getElementById('ec-engagement').value) || 0,
          imgViews: Number(document.getElementById('ec-imgviews').value) || 0,
          vidViews: Number(document.getElementById('ec-vidviews').value) || 0,
          clicks: Number(document.getElementById('ec-clicks').value) || 0,
          notes: document.getElementById('ec-notes').value,
          submittedAt: new Date().toISOString()
        };
        const slug = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').slice(0, 40);
        btn.disabled = true;
        const ok = await safeSet(`ec-event:${name}:${start}_${slug}_${Date.now()}`, JSON.stringify(event));
        btn.disabled = false;
        status().style.color = 'var(--ok)';
        status().textContent = ok ? 'Event logged.' : 'Could not save — try again.';
      }
      loadModHistory();
      checkBugCadence();
    }

    async function checkBugCadence() {
      if (currentRole() !== 'Sentinel' || !nameSel.value) return;
      const noteEl = document.getElementById('bug-cadence-note');
      if (!noteEl) return;
      const last = await safeGet(`mod-lastbug:${nameSel.value}`);
      if (!last) { noteEl.textContent = 'No bug report on file yet.'; noteEl.style.color = 'var(--warn)'; return; }
      const days = Math.floor((new Date(todayStr()) - new Date(last)) / 86400000);
      if (days >= 3) { noteEl.textContent = `Last bug report was ${days} days ago — due now.`; noteEl.style.color = 'var(--warn)'; }
      else { noteEl.textContent = `Last bug report: ${days === 0 ? 'today' : days + ' day(s) ago'}.`; noteEl.style.color = 'var(--text-muted)'; }
    }

    async function loadModHistory() {
      const name = nameSel.value, role = currentRole();
      if (!name) return;
      const hist = document.getElementById('mod-history');
      if (!hist) return;
      if (role === 'Event Coordinator') {
        const keys = await safeList(`ec-event:${name}:`);
        if (!keys.length) { hist.innerHTML = ''; return; }
        const recent = keys.sort().reverse().slice(0, 5);
        let html = '<div class="od-section-label">Your recent events</div>';
        for (const k of recent) {
          const v = await safeGet(k);
          if (!v) continue;
          const e = JSON.parse(v);
          html += `<div class="od-card"><div class="od-card-top"><span class="od-card-name">${escapeHtml(e.title)}</span><span class="od-card-date">${e.start}${e.end ? ' → ' + e.end : ''}</span></div>
            <div class="od-kv"><b>Reach:</b> ${e.reached} &nbsp; <b>Engagement:</b> ${e.engagement} &nbsp; <b>Reactions:</b> ${e.reactions} &nbsp; <b>Comments:</b> ${e.comments} &nbsp; <b>Shares:</b> ${e.shares}</div>
            ${e.groupName ? `<div class="od-kv"><b>FB Group:</b> ${escapeHtml(e.groupName)}</div>` : ''}
            ${(e.eventLink || e.winnerLink) ? `<div class="od-kv">${e.eventLink ? `<a href="${e.eventLink}" target="_blank" style="color:var(--gold)">Event post</a>` : ''}${e.eventLink && e.winnerLink ? ' &nbsp;·&nbsp; ' : ''}${e.winnerLink ? `<a href="${e.winnerLink}" target="_blank" style="color:var(--gold)">Winner posting</a>` : ''}</div>` : ''}
            ${e.notes ? `<div class="od-kv"><b>Notes:</b> ${escapeHtml(e.notes)}</div>` : ''}</div>`;
        }
        hist.innerHTML = html;
        return;
      }
      const keys = await safeList(`mod-report:${name}:`);
      if (!keys.length) { hist.innerHTML = ''; return; }
      const recent = keys.sort().reverse().slice(0, 5);
      let html = '<div class="od-section-label">Your recent reports</div>';
      for (const k of recent) {
        const v = await safeGet(k);
        if (!v) continue;
        const r = JSON.parse(v);
        html += `<div class="od-card"><div class="od-card-top"><span class="od-card-date">${r.date} · ${r.role || ''}</span></div>` +
          sentinelReportBodyHtml(r) +
          `</div>`;
      }
      hist.innerHTML = html;
    }
  }

      return start.slice(0, 7) === monthStr();
    });
    const ldrList = document.getElementById('admin-ldr-list');
    if (!ldrMonthKeys.length) {
      ldrList.innerHTML = '<div class="od-empty">No leader events logged yet this month.</div>';
    } else {
      let html = '';
      for (const k of ldrMonthKeys.sort()) {
        const v = await safeGet(k);
        if (!v) continue;
        const e = JSON.parse(v);
        html += `<div class="od-card"><div class="od-card-top"><span class="od-card-name">${escapeHtml(e.name)} — ${escapeHtml(e.title)}</span><span class="od-card-date">${e.start}${e.end ? ' → ' + e.end : ''}</span></div>
          <div class="od-kv"><b>Reach:</b> ${e.reached} &nbsp; <b>Engagement:</b> ${e.engagement} &nbsp; <b>Reactions:</b> ${e.reactions} &nbsp; <b>Comments:</b> ${e.comments} &nbsp; <b>Shares:</b> ${e.shares}</div>
            ${e.groupName ? `<div class="od-kv"><b>FB Group:</b> ${escapeHtml(e.groupName)}</div>` : ''}
            ${(e.eventLink || e.winnerLink) ? `<div class="od-kv">${e.eventLink ? `<a href="${e.eventLink}" target="_blank" style="color:var(--gold)">Event post</a>` : ''}${e.eventLink && e.winnerLink ? ' &nbsp;·&nbsp; ' : ''}${e.winnerLink ? `<a href="${e.winnerLink}" target="_blank" style="color:var(--gold)">Winner posting</a>` : ''}</div>` : ''}
          ${e.feedback ? `<div class="od-kv"><b>Feedback:</b> ${escapeHtml(e.feedback)}</div>` : ''}</div>`;
      }
      ldrList.innerHTML = html;
    }

    // -- Generic per-person effectiveness for event-based roles (EC / Leader) --
    function eventEffectivenessCard(name, roleLabel, events) {
      if (!events.length) return '<div class="od-empty">No events from this person in this window.</div>';
      let m1 = 0, m2 = 0, m3 = 0, lastDate = null;
      let reachRateSum = 0, engRateSum = 0, normalizedCount = 0;
      for (const e of events) {
        m1 += e.reached || 0; m2 += e.engagement || 0; m3 += (e.reactions || 0) + (e.comments || 0) + (e.shares || 0);
        if (!lastDate || e.start > lastDate) lastDate = e.start;
        if (e.groupSize) {
          reachRateSum += (e.reached || 0) / e.groupSize * 100;
          engRateSum += (e.engagement || 0) / e.groupSize * 100;
          normalizedCount++;
        }
      }
      const avgReachRate = normalizedCount ? (reachRateSum / normalizedCount).toFixed(1) : null;
      const avgEngRate = normalizedCount ? (engRateSum / normalizedCount).toFixed(1) : null;
      let html = `<div class="od-card">
        <div class="od-card-top"><span class="od-card-name">${escapeHtml(name)} — ${roleLabel}</span><span class="od-card-date">last active ${lastDate || '—'}</span></div>
        <div class="od-kv"><b>Events in window:</b> ${events.length}</div>
        <div class="od-kv"><b>Total people reached:</b> ${m1} &nbsp; <b>Total post engagement:</b> ${m2} &nbsp; <b>Total reactions+comments+shares:</b> ${m3}</div>
        <div class="od-kv" style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border);"><b style="color:var(--gold);">Avg. reach rate:</b> ${avgReachRate === null ? '— (no group size logged)' : avgReachRate + '% of group'} &nbsp; <b style="color:var(--gold);">Avg. engagement rate:</b> ${avgEngRate === null ? '—' : avgEngRate + '% of group'}</div>
        <div style="font-size:11px;color:var(--text-muted);margin-top:4px;">Rates are reach/engagement as a share of the group's member count, so a coordinator with a smaller group isn't penalized for having a smaller raw number.</div>
      </div>`;
      html += '<div class="od-section-label">Recent events</div>';
      for (const e of events.slice(0, 5)) {
        const rate = e.groupSize ? ` (${((e.reached||0)/e.groupSize*100).toFixed(1)}% reach, ${((e.engagement||0)/e.groupSize*100).toFixed(1)}% engagement of ${e.groupSize})` : '';
        html += `<div class="od-card"><div class="od-card-top"><span class="od-card-name">${escapeHtml(e.title)}</span><span class="od-card-date">${e.start}${e.end ? ' → ' + e.end : ''}</span></div>
          <div class="od-kv"><b>Reach:</b> ${e.reached} &nbsp; <b>Engagement:</b> ${e.engagement} &nbsp; <b>R/C/S:</b> ${e.reactions}/${e.comments}/${e.shares}${rate}</div></div>`;
      }
      return html;
    }

    const ecPick = document.getElementById('ec-pick');
    const ecWindow = document.getElementById('ec-window');
    ecPick.innerHTML = '<option value="">Select a coordinator</option>' + EC_NAMES.map(p => `<option value="${p}">${p}</option>`).join('');
    async function renderEcEffectiveness() {
      const name = ecPick.value;
      const panel = document.getElementById('ec-effectiveness');
      if (!name) { panel.innerHTML = ''; return; }
      const days = Number(ecWindow.value);
      const cutoff = new Date(todayStr()); cutoff.setDate(cutoff.getDate() - days);
      const keys = await safeList(`ec-event:${name}:`);
      const events = [];
      for (const k of keys.sort().reverse()) {
        const start = (k.split(':')[2] || '').split('_')[0];
        if (new Date(start) < cutoff) continue;
        const v = await safeGet(k); if (!v) continue;
        events.push(JSON.parse(v));
      }
      panel.innerHTML = eventEffectivenessCard(name, 'Event Coordinator', events);
    }
    ecPick.addEventListener('change', renderEcEffectiveness);
    ecWindow.addEventListener('change', renderEcEffectiveness);

    const ldrPick = document.getElementById('ldr-pick');
    const ldrWindow = document.getElementById('ldr-window');
    ldrPick.innerHTML = '<option value="">Select a leader</option>' + LEADERS.map(l => `<option value="${escapeHtml(l.name)}">${escapeHtml(l.name)}</option>`).join('');
    async function renderLdrEffectiveness() {
      const name = ldrPick.value;
      const panel = document.getElementById('ldr-effectiveness');
      if (!name) { panel.innerHTML = ''; return; }
      const days = Number(ldrWindow.value);
      const cutoff = new Date(todayStr()); cutoff.setDate(cutoff.getDate() - days);
      const keys = await safeList(`leader-event:${name}:`);
      const events = [];
      for (const k of keys.sort().reverse()) {
        const start = (k.split(':')[2] || '').split('_')[0];
        if (new Date(start) < cutoff) continue;
        const v = await safeGet(k); if (!v) continue;
        events.push(JSON.parse(v));
      }
      panel.innerHTML = eventEffectivenessCard(name, 'Community Leader', events);
    }
    ldrPick.addEventListener('change', renderLdrEffectiveness);
    ldrWindow.addEventListener('change', renderLdrEffectiveness);

    // -- Full event history, split per role --
    async function renderRoleEventsTable(keys, tableId, filterId, roleLabel) {
      const events = [];
      for (const k of keys) {
        const parts = k.split(':');
        const v = await safeGet(k);
        if (!v) continue;
        const e = JSON.parse(v);
        events.push({ ...e, person: e.name, start: e.start || (parts[2] || '').split('_')[0] });
      }
      events.sort((a, b) => (b.start || '').localeCompare(a.start || ''));

      const filterSel = document.getElementById(filterId);
      const people = [...new Set(events.map(e => e.person))].sort();
      filterSel.innerHTML = '<option value="">Everyone</option>' + people.map(p => `<option value="${p}">${p}</option>`).join('');
      function render(filterPerson) {
        const rows = filterPerson ? events.filter(e => e.person === filterPerson) : events;
        const tableDiv = document.getElementById(tableId);
        if (!rows.length) { tableDiv.innerHTML = '<div class="od-empty">No events logged yet.</div>'; return; }
        let html = `<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;min-width:600px;">
          <thead><tr style="border-bottom:1px solid var(--border);text-align:left;color:var(--text-muted);">
            <th style="padding:8px 6px;">Date</th>
            <th style="padding:8px 6px;">Person</th>
            <th style="padding:8px 6px;">Event</th>
            <th style="padding:8px 6px;">Reach</th>
            <th style="padding:8px 6px;">Engagement</th>
            <th style="padding:8px 6px;">R/C/S</th>
            <th style="padding:8px 6px;">Links</th>
          </tr></thead><tbody>`;
        for (const e of rows) {
          html += `<tr style="border-bottom:1px solid var(--border);">
            <td style="padding:8px 6px;color:var(--text-muted);">${e.start || '—'}${e.end ? ' → ' + e.end : ''}</td>
            <td style="padding:8px 6px;font-weight:600;">${escapeHtml(e.person)}</td>
            <td style="padding:8px 6px;">${escapeHtml(e.title) || '—'}${e.groupName ? `<br><span style="color:var(--text-muted);font-size:11px;">${escapeHtml(e.groupName)}</span>` : ''}</td>
            <td style="padding:8px 6px;">${e.reached || 0}</td>
            <td style="padding:8px 6px;">${e.engagement || 0}</td>
            <td style="padding:8px 6px;">${e.reactions || 0}/${e.comments || 0}/${e.shares || 0}</td>
            <td style="padding:8px 6px;">${e.eventLink ? `<a href="${e.eventLink}" target="_blank" style="color:var(--gold)">Event</a>` : ''}${e.eventLink && e.winnerLink ? ' · ' : ''}${e.winnerLink ? `<a href="${e.winnerLink}" target="_blank" style="color:var(--gold)">Winners</a>` : ''}${!e.eventLink && !e.winnerLink ? '—' : ''}</td>
          </tr>`;
        }
        html += '</tbody></table></div>';
        tableDiv.innerHTML = html;
      }
      filterSel.addEventListener('change', () => render(filterSel.value));
      render('');
    }

    await renderRoleEventsTable(ecKeys, 'ec-events-table', 'ec-events-filter', 'Event Coordinator');
    await renderRoleEventsTable(ldrKeys, 'ldr-events-table', 'ldr-events-filter', 'Community Leader');
  }

  // ---------- TRACKER ----------
  let trackerPeriod = 30;
  async function renderTracker() {
    main.innerHTML = `
      <h1 class="od-h1">Effectiveness tracker</h1>
      <p class="od-sub">Aggregated from submitted reports — a running record per moderator, not just today's snapshot.</p>
      <div class="od-row">
        <label class="od-label" style="margin:0">Window:</label>
        <select class="od-select" id="tracker-period">
          <option value="7">Last 7 days</option>
          <option value="30" selected>Last 30 days</option>
          <option value="9999">All time</option>
        </select>
      </div>
      <div id="tracker-body"><div class="od-loading">Crunching numbers…</div></div>
    `;
    document.getElementById('tracker-period').addEventListener('change', (e) => {
      trackerPeriod = Number(e.target.value);
      buildTable();
    });
    await buildTable();

    async function buildTable() {
      const modKeys = await safeList('mod-report:');
      const ecKeys = await safeList('ec-event:');
      const cutoff = new Date(todayStr());
      cutoff.setDate(cutoff.getDate() - trackerPeriod);
      const perMod = {};
      for (const m of Object.keys(MOD_ROSTER)) perMod[m] = { role: null, reports: 0, lastDate: null, m1: 0, m2: 0, m3: 0, isEvent: false };

      for (const k of modKeys) {
        const parts = k.split(':');
        const name = parts[1], date = parts[2];
        if (!name || !date) continue;
        if (new Date(date) < cutoff) continue;
        const v = await safeGet(k);
        if (!v) continue;
        const r = JSON.parse(v);
        if (r.role !== 'Sentinel') continue;
        if (!perMod[name]) perMod[name] = { role: null, reports: 0, lastDate: null, m1: 0, m2: 0, m3: 0, isEvent: false };
        const p = perMod[name];
        p.role = r.role;
        p.reports += 1;
        if (!p.lastDate || date > p.lastDate) p.lastDate = date;
        const met = r.metrics || {};
        p.m1 += (r.feedbackEntries || []).length;
        p.m2 += (r.suggestionEntries || []).length;
        p.m3 += (r.approvedMembers || 0) + (r.approvedPosts || 0);
      }

      for (const k of ecKeys) {
        const parts = k.split(':');
        const name = parts[1];
        const start = (parts[2] || '').split('_')[0];
        if (!name || !start) continue;
        if (new Date(start) < cutoff) continue;
        const v = await safeGet(k);
        if (!v) continue;
        const e = JSON.parse(v);
        if (!perMod[name]) perMod[name] = { role: null, reports: 0, lastDate: null, m1: 0, m2: 0, m3: 0, isEvent: false };
        const p = perMod[name];
        p.role = 'Event Coordinator';
        p.isEvent = true;
        p.reports += 1;
        if (!p.lastDate || start > p.lastDate) p.lastDate = start;
        p.m1 += e.reached || 0;
        p.m2 += e.engagement || 0;
        p.m3 += (e.reactions || 0) + (e.comments || 0) + (e.shares || 0);
      }

      const ldrKeysT = await safeList('leader-event:');
      for (const k of ldrKeysT) {
        const parts = k.split(':');
        const name = parts[1];
        const start = (parts[2] || '').split('_')[0];
        if (!name || !start) continue;
        if (new Date(start) < cutoff) continue;
        const v = await safeGet(k);
        if (!v) continue;
        const e = JSON.parse(v);
        if (!perMod[name]) perMod[name] = { role: null, reports: 0, lastDate: null, m1: 0, m2: 0, m3: 0, isEvent: false };
        const p = perMod[name];
        p.role = 'Community Leader';
        p.isEvent = true;
        p.reports += 1;
        if (!p.lastDate || start > p.lastDate) p.lastDate = start;
        p.m1 += e.reached || 0;
        p.m2 += e.engagement || 0;
        p.m3 += (e.reactions || 0) + (e.comments || 0) + (e.shares || 0);
      }

      const days = Math.min(trackerPeriod, 365);
      const rows = Object.entries(perMod).map(([name, p]) => {
        const consistency = (p.role && !p.isEvent) ? Math.min(100, Math.round((p.reports / days) * 100)) : null;
        return { name, ...p, consistency };
      }).sort((a, b) => b.reports - a.reports);

      const sentinelCols = ['Feedback entries', 'Suggestion entries', 'Approved (members+posts)'];
      const ecCols = ['People reached (total)', 'Post engagement (total)', 'Reactions+comments+shares'];

      let html = `<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:13px;margin-top:14px;min-width:600px;">
        <thead><tr style="border-bottom:1px solid var(--border);text-align:left;color:var(--text-muted);">
          <th style="padding:8px 6px;">Name</th>
          <th style="padding:8px 6px;">Role</th>
          <th style="padding:8px 6px;">Reports / events</th>
          <th style="padding:8px 6px;">Consistency</th>
          <th style="padding:8px 6px;">Metric 1</th>
          <th style="padding:8px 6px;">Metric 2</th>
          <th style="padding:8px 6px;">Metric 3</th>
          <th style="padding:8px 6px;">Last active</th>
        </tr></thead><tbody>`;
      for (const r of rows) {
        const cols = r.role === 'Sentinel' ? sentinelCols : ((r.role === 'Event Coordinator' || r.role === 'Community Leader') ? ecCols : ['—', '—', '—']);
        html += `<tr style="border-bottom:1px solid var(--border);">
          <td style="padding:8px 6px;font-weight:600;">${r.name}</td>
          <td style="padding:8px 6px;color:var(--text-muted);">${r.role || 'no reports yet'}</td>
          <td style="padding:8px 6px;">${r.reports}</td>
          <td style="padding:8px 6px;">${r.consistency === null ? '—' : r.consistency + '%'}</td>
          <td style="padding:8px 6px;" title="${cols[0]}">${r.m1}</td>
          <td style="padding:8px 6px;" title="${cols[1]}">${r.m2}</td>
          <td style="padding:8px 6px;" title="${cols[2]}">${r.m3}</td>
          <td style="padding:8px 6px;color:var(--text-muted);">${r.lastDate || '—'}</td>
        </tr>`;
      }
      html += '</tbody></table></div>';
      html += `<p style="font-size:12px;color:var(--text-muted);margin-top:10px;">
        Sentinel metrics: feedback entries logged · suggestion entries logged · approved members + approved posts, summed across daily EOD reports. Consistency = daily reports ÷ days in window.<br>
        Event Coordinator metrics: total people reached · total post engagement · total reactions+comments+shares, summed across events logged in this window. Consistency isn't shown for Event Coordinators — they report per event, not daily, so a rate against calendar days would be misleading.<br>
        Sorted by report/event volume — re-sort by whichever column matters most to you once you're comparing a full month.</p>`;
      document.getElementById('tracker-body').innerHTML = html;
    }
  }

  render();
})();
</script>

</body>
</html>
